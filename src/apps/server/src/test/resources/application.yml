spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  secret: thisconnect-test-secret-key-must-be-at-least-256-bits-long-for-hs256

oauth:
  kakao:
    client-id: test
    client-secret: test
    redirect-uri: http://localhost:3000/callback/kakao
  google:
    client-id: test
    client-secret: test
    redirect-uri: http://localhost:3000/callback/google
