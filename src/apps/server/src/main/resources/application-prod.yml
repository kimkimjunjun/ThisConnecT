spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update   # 첫 배포 성공 후 validate로 변경
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000},http://localhost:3000
  cookie:
    secure: true

logging:
  level:
    com.thisconnect: INFO
    org.springframework: WARN
    org.hibernate: WARN
