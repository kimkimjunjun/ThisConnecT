name: BE Deploy

on:
  push:
    branches: [develop]
    paths:
      - 'src/apps/server/**'

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x src/apps/server/gradlew

      - name: Build JAR
        working-directory: src/apps/server
        run: ./gradlew clean bootJar -x test

      - name: Transfer JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: src/apps/server/build/libs/server-0.0.1-SNAPSHOT.jar
          target: /home/ec2-user/
          strip_components: 5

      - name: Restart service on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mv /home/ec2-user/server-0.0.1-SNAPSHOT.jar /home/ec2-user/app.jar
            sudo systemctl restart thisconnect
            sleep 5
            sudo systemctl is-active --quiet thisconnect && echo "✅ 배포 성공" || echo "❌ 배포 실패"
